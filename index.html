const isLight=h=>{const n=parseInt(String(h).replace('#',''),16)||0;return(0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))>150};
function applyTheme(){const t=thm(),r=document.documentElement,sp=(k,v)=>r.style.setProperty(k,v),mix=(a,p,b)=>'color-mix(in srgb,'+a+' '+p+'%,'+b+')';
 sp('--bg',t.bg);sp('--glow',t.glow);sp('--card',t.card);sp('--t',t.text);sp('--b',t.accent);sp('--b2',mix(t.accent,60,t.text));sp('--btn2',mix(t.accent,70,'black'));
 sp('--m',mix(mix(t.text,60,t.bg),85,t.accent));sp('--line',mix(t.card,78,t.accent));sp('--chip',mix(t.card,85,t.accent));sp('--chip2',mix(t.bg,40,t.card));sp('--inp',mix(t.bg,60,t.card));sp('--hero1',t.glow);

 <label>Variantes o packs (Nombre | precio, una por línea. Ej: Pack 100 créditos | 8.000. Sin precio usa el del producto)</label><textarea id="f_var" rows="3">${esc(p.variants.map(v=>v.name+(v.price?' | '+v.price:'')).join('\n'))}</textarea><label>Medios de pago de este producto</label><div class="row">${D.pays.map(x=>`<label><input type="checkbox" class="f_pm" value="${esc(x.name)}" ${!p.pm?.length||p.pm.includes(x.name)?'checked':''} style="width:auto"> ${esc(x.name)}</label>`).join('')}</div><label>Cuentas de cobro propias de este producto (opcional; si lo dejás vacío usa las generales). Una por línea: Medio | alias o CBU | titular | instrucciones | link de pago (opcional)</label><textarea id="f_accts" rows="3" placeholder="Mercado Pago | mathi.mp | Tu nombre | Enviá el monto exacto | https://link.mercadopago.com.ar/tutienda">${esc((p.accts||[]).map(a=>[a.name,a.alias,a.holder,a.info,a.link||''].join(' | ').replace(/( \| )+$/,'')).join('\n'))}</textarea><label>Packs de créditos (solo panel de créditos). Escribí cantidad:precio separados por coma. Ej: 10:18000, 18:30000</label><input id="f_packs" value="${esc(p.packs||'10,20,30,40')}"><label>Precio del crédito suelto en ARS (de 1 a 9 créditos; vacío = no se venden sueltos)</label><input id="f_pc" inputmode="decimal" placeholder="1.500" value="${p.perCredit||''}"><div class="row"><div><label>Etiqueta en la tarjeta</label><select id="f_badge"><option value="">Sin etiqueta</option>${BADGES.map(b=>`<option ${p.badge===b?'selected':''}>${b}</option>`).join('')}</select></div><div><label>La promo termina (opcional, muestra cuenta regresiva)</label><input id="f_pend" type="datetime-local" value="${esc(p.promoEnd||'')}"></div></div><label>Imagen</label><input type="file" id="f_img" accept="image/*"><div class="row"><label><input type="checkbox" id="f_feat" ${p.featured?'checked':''} style="width:auto"> Destacado</label><label><input type="checkbox" id="f_combo" ${p.combo?'checked':''} style="width:auto"> Combo</label><label><input type="checkbox" id="f_cred" ${p.credits?'checked':''} style="width:auto"> Panel de créditos</label><label><input type="checkbox" id="f_trial" ${p.trial?'checked':''} style="width:auto"> Ofrece prueba gratis</label><label><input type="checkbox" id="f_demo" ${p.demo?'checked':''} style="width:auto"> Ofrece demo (botón «Solicitar una demo»)</label></div><label><input type="checkbox" id="f_down" ${p.down?'checked':''} style="width:auto"> ⚠ Servicio con inconvenientes (muestra un aviso en la tienda)</label><label>Mensaje del aviso (opcional)</label><input id="f_dmsg" placeholder="Ej: Estamos cambiando de servidor, vuelve en unas horas." value="${esc(p.downMsg||'')}"><div class="row"><button class="btn" data-a="saveP">Guardar producto</button><button class="btn g" data-a="cancel">Cancelar</button></div></div>`}
async function saveP(){const g=i=>$('#'+i).value,old=S.ed==='new'?null:D.products.find(x=>x.id==S.ed),f=$('#f_img').files[0];if(!g('f_name').trim()||!(ars(g('f_price'))>0||$('#f_cred').checked))return toast('Escribí un precio válido en pesos (ej: 10.000)');
 const p={id:old?old.id:Date.now(),name:g('f_name').trim(),descr:g('f_descr'),cat:g('f_cat'),price:ars(g('f_price'))||0,promo:g('f_promo')?(ars(g('f_promo'))||0):0,stock:g('f_stock')===''?-1:+g('f_stock'),days:+g('f_days')||30,months:g('f_months').split(',').map(x=>parseInt(x)).filter(x=>x>0).join(',')||'1',
 variants:g('f_var').split('\n').filter(l=>l.trim()).map(l=>{const[n,pr]=l.split('|');return{name:n.trim(),price:ars(pr)||null}}),featured:$('#f_feat').checked,combo:$('#f_combo').checked,trial:$('#f_trial').checked,demo:$('#f_demo').checked,down:$('#f_down').checked,downMsg:g('f_dmsg').trim(),badge:g('f_badge'),promoEnd:g('f_pend'),credits:$('#f_cred').checked,packs:$('#f_packs').value.split(',').map(x=>x.trim()).filter(x=>parseInt(x)>0).join(',')||'10,20,30,40',perCredit:ars($('#f_pc').value)||0,accts:$('#f_accts').value.split('\n').filter(l=>l.trim()).map(l=>{const[name,alias,holder,info,link]=l.split('|').map(x=>(x||'').trim());return{name,alias,holder,info,link}}),pm:(c=>c.length===D.pays.length?[]:c)([...document.querySelectorAll('.f_pm:checked')].map(x=>x.value)),hidden:old?old.hidden:false,image:f?await readImg(f,480):(old?.image||'')};
 old?Object.assign(old,p):D.products.unshift(p);S.ed=null;admin();await publish()}
async function saveCfg(){const g=i=>$('#'+i).value;D.name=g('c_name');D.desc=g('c_desc');D.wa=g('c_wa');D.low=g('c_low')||3;Object.assign(D.st,{mode:g('s_mode'),openText:g('s_ot')||'Tienda abierta',closedText:g('s_ct')||'Tienda cerrada',from:g('s_from')||'09:00',to:g('s_to')||'22:00',block:$('#s_blk').checked,notice:g('s_nt'),anim:$('#s_an').checked,payNote:g('s_pn'),coupons:g('c_cps'),faq:g('c_faq'),reviews:g('c_rev'),ga:g('c_ga').trim(),ntfy:g('c_ntfy').trim(),storeUrl:g('l_store')||D.st.storeUrl,links:{play:g('l_play'),apk:g('l_apk'),telegram:g('l_telegram'),instagram:g('l_instagram'),facebook:g('l_facebook'),tiktok:g('l_tiktok')}});D.cats=g('c_cats').split(',').map(x=>x.trim()).filter(Boolean);
 D.pays=g('c_pays').split('\n').filter(l=>l.trim()).map(l=>{const[name,alias,holder,info,link]=l.split('|').map(x=>(x||'').trim());return{name,alias,holder,info,link}});paint();await publish()}
async function publish(){if(ghMode()){if(!tk()){toast('Iniciá sesión como administrador para guardar.');return}try{toast('Guardando…');await ghPut(buildDoc(true));toast('Guardado ✔ En 1 o 2 minutos se ve en la tienda.')}catch(e){toast(pubErr(e))}return}try{sessionStorage.setItem('mn_admin','1')}catch(e){}const fail=m=>{try{sessionStorage.removeItem('mn_admin')}catch(e){}toast(m)};try{const art=await claude.use('artifact');if(!art)return fail('Guardar no está disponible en este momento.');
 await art.publish(buildDoc());toast('Guardado y publicado ✔')}catch(e){fail(pubErr(e))}}
if(ghMode()&&tk()){S.owner=true;if(location.hash==='#admin')S.view='admin'}
paint();gaInit();hp();if(ghMode()&&!tk()&&location.hash==='#admin')loginSheet();
window.claude?.use('user').then(u=>{if(u?.isOwner()){S.owner=true;let f=false;try{f=sessionStorage.getItem('mn_admin')==='1';sessionStorage.removeItem('mn_admin')}catch(e){}if(location.hash==='#admin'||f)S.view='admin';paint()}}).catch(()=>{});
</script></body></html>
