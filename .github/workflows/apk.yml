name: Compilar app Android
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: Publicar APK para descargar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk mathinet.apk
          gh release delete app --yes --cleanup-tag || true
          gh release create app mathinet.apk --title "App Mathi Net" --notes "App Android de la tienda Mathi Net."
